schema:
  schema_id: jianxin_pinyin
  name: 简心全拼
  version: '0.1.0'
switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 英文]
engine:
  processors:
    - ascii_composer
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - uniquifier
menu:
  page_size: 8
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
  algebra:
    - derive/^([a-z]).+$/$1/
    - derive/^([zcs]h).+$/$1/
translator:
  dictionary: jianxin
  prism: jianxin_pinyin
  enable_user_dict: true
  enable_sentence: true
  enable_completion: true
  spelling_hints: 0
punctuator:
  half_shape:
    ',': '，'
    '.': '。'
    '?': '？'
    '!': '！'
